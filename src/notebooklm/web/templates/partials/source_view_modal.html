<div id="source-view-modal" class="modal-backdrop hidden">
  <div class="modal" style="max-width: 820px;">
    <div class="modal-header">
      <h3 id="source-view-title">Source</h3>
      <button class="btn-icon" id="close-source-view-modal" title="Close">×</button>
    </div>
    <div class="modal-body">
      <div class="muted" id="source-view-meta" style="font-size:12px; margin-bottom:10px;"></div>
      <pre id="source-view-content" style="white-space: pre-wrap; word-break: break-word; margin: 0; font-family: inherit; font-size: 13px; line-height: 1.55;"></pre>
    </div>
    <div class="modal-footer">
      <button class="btn" id="close-source-view-btn">Close</button>
    </div>
  </div>
</div>
